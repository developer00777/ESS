<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#faf9f6" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				var stored = localStorage.getItem('essTheme');
				var theme =
					stored === 'dark' || stored === 'light'
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				if (theme === 'dark') document.documentElement.setAttribute('data-ess-theme', 'dark');
				if (localStorage.getItem('essShell') === 'rail')
					document.documentElement.setAttribute('data-ess-shell', 'rail');

				// Appearance settings (Super Admin only, set at /admin/tweaks).
				// Applied pre-paint so previewing never flashes the default first.
				try {
					var tweaks = JSON.parse(localStorage.getItem('essTweaks') || '{}');
					for (var attr in tweaks) {
						if (attr.indexOf('data-ess-') === 0 && tweaks[attr])
							document.documentElement.setAttribute(attr, tweaks[attr]);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
