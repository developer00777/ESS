<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#faf9f6" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Plus+Jakarta+Sans:wght@400..800&family=Geist:wght@400..700&family=Manrope:wght@400..800&family=Jost:wght@400..700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				var stored = localStorage.getItem('essTheme');
				var theme =
					stored === 'dark' || stored === 'light'
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				if (theme === 'dark') document.documentElement.setAttribute('data-ess-theme', 'dark');
				// The look (Original, Mono, Atur, …), from the account menu.
				var skin = localStorage.getItem('essSkin');
				if (skin === 'mono' || skin === 'atur' || skin === 'amber')
					document.documentElement.setAttribute('data-ess-skin', skin);
				// Collapsed sidebar (themes with an expanding sidebar: Mono).
				if (localStorage.getItem('essSidebar') === 'collapsed')
					document.documentElement.setAttribute('data-ess-sidebar', 'collapsed');
				if (localStorage.getItem('essShell') === 'rail')
					document.documentElement.setAttribute('data-ess-shell', 'rail');
				// Text size and dock, from the account menu (TopBar).
				var textScale = parseFloat(localStorage.getItem('essTextScale') || '');
				if (textScale >= 0.8 && textScale <= 1.5) {
					document.documentElement.style.setProperty('--ess-text-scale', String(textScale));
					// Enlarged text: pages flow and scroll instead of fitting the screen.
					if (textScale > 1) document.documentElement.setAttribute('data-ess-flow', '');
				}
				if (localStorage.getItem('essDock') === 'fixed')
					document.documentElement.setAttribute('data-ess-dock', 'fixed');

				// The app's opening corridor plays once per browser session; after
				// that, a refresh or a new page opens straight away ((app)/+layout).
				try {
					if (sessionStorage.getItem('essIntroSeen'))
						document.documentElement.setAttribute('data-ess-intro-seen', '');
				} catch (e) {}

				// Appearance settings (Super Admin only, set at /admin/tweaks).
				// Applied pre-paint so previewing never flashes the default first.
				try {
					var tweaks = JSON.parse(localStorage.getItem('essTweaks') || '{}');
					for (var attr in tweaks) {
						if (attr.indexOf('data-ess-') === 0 && tweaks[attr])
							document.documentElement.setAttribute(attr, tweaks[attr]);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
